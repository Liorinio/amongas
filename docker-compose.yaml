version: "3"

services:

  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: oltp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    networks:
      - dem

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    ports:
      - "5000:80"
    depends_on:
      - postgres
    networks:
      - dem

  app:
    build:
        context: .
        dockerfile: Dockerfile_app
    depends_on:
        - postgres
    networks:
        - dem

networks:
  dem: